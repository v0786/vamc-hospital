<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="100%" height="100%" fill="none" aria-label="VAMC Hospital Logo - Value Added Medical Care">
  <!-- Outer Shield Border in Deep VAMC Teal -->
  <path
    d="M 200 24 
       C 242 46, 298 52, 336 50 
       C 342 74, 344 140, 332 208 
       C 316 286, 258 358, 200 408 
       C 142 358, 84 286, 68 208 
       C 56 140, 58 74, 64 50 
       C 102 52, 158 46, 200 24 Z"
    fill="#FFFFFF"
    stroke="#115572"
    stroke-width="15"
    stroke-linejoin="round"
  />

  <!-- Inner shield boundary line for double-crest depth -->
  <path
    d="M 200 36 
       C 238 56, 290 61, 324 60 
       C 330 82, 331 142, 320 204 
       C 306 274, 252 342, 200 390 
       C 148 342, 94 274, 80 204 
       C 69 142, 70 82, 76 60 
       C 110 61, 162 56, 200 36 Z"
    fill="none"
    stroke="#115572"
    stroke-width="2.5"
    opacity="0.3"
  />

  <!-- Top Text: VAMC in Deep VAMC Teal -->
  <g fill="#115572" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="200" y="108" font-size="44" letter-spacing="4" font-weight="900">VAMC</text>
  </g>

  <!-- Value Added Medical Care brand subtitle -->
  <g fill="#68757A" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="200" y="126" font-size="9" letter-spacing="1.8" font-weight="700">VALUE ADDED MEDICAL CARE</text>
  </g>

  <!-- Sub Text: HOSPITAL with stylized chevron Delta -->
  <g fill="#115572" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle">
    <text x="146" y="150" font-size="20" letter-spacing="3.5">HOSPIT</text>
    <!-- Stylized Delta A in VAMC Red accent -->
    <path d="M 252 150 L 260 133 L 268 150 Z M 256 147 L 264 147 L 260 138 Z" fill="#EF3236" />
    <text x="281" y="150" font-size="20" letter-spacing="3.5">L</text>
  </g>

  <!-- Red Wing Emblem (Left) in VAMC Red (#EF3236) -->
  <g fill="#EF3236">
    <!-- Feather 1 (Topmost sweeping wing tip) -->
    <path d="M 198 392 C 146 348 76 250 68 108 C 66 98 74 100 82 110 C 102 136 128 178 152 222 C 172 260 188 322 198 392 Z" />
    
    <!-- Feather 2 -->
    <path d="M 194 394 C 140 342 70 266 74 154 C 75 146 84 150 90 160 C 114 196 142 246 166 296 C 182 332 190 370 194 394 Z" />
    
    <!-- Feather 3 -->
    <path d="M 190 395 C 138 340 76 288 88 198 C 90 190 98 194 104 204 C 126 238 154 288 174 340 C 184 366 188 384 190 395 Z" />
    
    <!-- Feather 4 -->
    <path d="M 186 397 C 140 346 94 308 106 244 C 108 238 116 242 122 250 C 140 280 164 326 180 368 C 184 380 185 390 186 397 Z" />
    
    <!-- Feather 5 -->
    <path d="M 184 399 C 146 360 118 334 128 290 C 130 284 137 288 142 295 C 156 320 172 356 182 388 C 183 394 184 398 184 399 Z" />

    <!-- Feather 6 (Innermost base plume) -->
    <path d="M 186 401 C 158 375 142 358 148 332 C 150 328 156 331 159 337 C 168 354 178 378 184 398 C 185 400 186 401 186 401 Z" />
  </g>

  <!-- Medical Caduceus Symbol (Right) in Deep VAMC Teal (#115572) -->
  <g fill="#115572" stroke="#115572">
    <!-- Caduceus Top Knob / Finial -->
    <circle cx="250" cy="180" r="4.5" />
    <!-- Central Staff -->
    <path d="M 248.5 184 L 251.5 184 L 251.5 304 L 248.5 304 Z" stroke-width="0.5" />
    <!-- Staff bottom tip -->
    <polygon points="248,304 252,304 250,310" />

    <!-- Caduceus Wings -->
    <!-- Left Wing -->
    <path
      d="M 250 187 
         C 240 180, 222 178, 206 186 
         C 214 192, 226 195, 238 194 
         C 244 193, 248 190, 250 187 Z"
      stroke-width="0.5"
    />
    <!-- Right Wing -->
    <path
      d="M 250 187 
         C 260 180, 278 178, 294 186 
         C 286 192, 274 195, 262 194 
         C 256 193, 252 190, 250 187 Z"
      stroke-width="0.5"
    />

    <!-- Entwined Serpents (Body Curves) -->
    <!-- Serpent 1 (Looping) -->
    <path
      d="M 243 197 
         C 230 205, 230 220, 245 228 
         C 260 236, 260 252, 246 260 
         C 236 266, 238 278, 250 286"
      fill="none"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Serpent 1 Head -->
    <path d="M 244 195 C 241 193 238 196 242 198 Z" />

    <!-- Serpent 2 (Opposite Looping) -->
    <path
      d="M 257 197 
         C 270 205, 270 220, 255 228 
         C 240 236, 240 252, 254 260 
         C 264 266, 262 278, 250 286"
      fill="none"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Serpent 2 Head -->
    <path d="M 256 195 C 259 193 262 196 258 198 Z" />
  </g>
</svg>
